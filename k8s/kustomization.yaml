apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Needs ghcr-pull-secret in this namespace (copied from default, never stored in git).
namespace: hub
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hub-auth.sealedsecret.yaml
  - hub-db.sealedsecret.yaml
  - postgres.yaml
images:
  - name: ghcr.io/daav817/home-lab-hub
    newTag: "0.1.0.18"
