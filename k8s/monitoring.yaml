# Prometheus reads the router drives' usage from the hub (/api/metrics, bearer token from the
# hub-metrics secret) and emails through Alertmanager when a drive passes 85%.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hub
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hub
  endpoints:
    - port: http
      path: /api/metrics
      interval: 5m
      scrapeTimeout: 60s
      authorization:
        type: Bearer
        credentials:
          name: hub-metrics
          key: METRICS_TOKEN
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hub-router-drives
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: router-drives
      rules:
        - alert: RouterDriveAlmostFull
          expr: hub_router_drive_used_bytes / hub_router_drive_size_bytes >= 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: The router drive with {{ $labels.shares }} is {{ $value | humanizePercentage }} full.
        - alert: RouterFilesUnreachable
          expr: hub_router_files_up == 0 or absent(hub_router_files_up)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: The hub can't read the router's shares, so drive usage isn't being checked.
