apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hub-postgres
  labels:
    app.kubernetes.io/name: hub-postgres
spec:
  serviceName: hub-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hub-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-trixie
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: hub
            - name: POSTGRES_DB
              value: hub
            # A subfolder, because the volume root holds lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hub-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hub", "-d", "hub", "-h", "127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "hub", "-d", "hub", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hub-postgres
  labels:
    app.kubernetes.io/name: hub-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hub-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
# Only the hub can reach its database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hub-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hub
      ports:
        - protocol: TCP
          port: postgres
