# Headlamp runs without a login of its own (see ../argocd-application.yaml), so Traefik asks
# Authentik about every request, and only admins are allowed through. The Cloudflare route
# must point at Traefik, never at the headlamp service, which would skip this.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: headlamp
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ui
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.energiapower.llc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
---
# The login redirect comes back to this path on the same address. It lives in the authentik
# namespace because an Ingress can only reach services in its own namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-login
  namespace: authentik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.energiapower.llc
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
