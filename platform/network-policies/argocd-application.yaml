# Applied once by hand: kubectl apply -f platform/network-policies/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/daav817/home-lab-hub.git
    targetRevision: main
    path: platform/network-policies/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: calico-system
  syncPolicy:
    automated:
      selfHeal: true
