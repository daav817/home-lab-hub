# Lets Prometheus read Longhorn's metrics, and emails an alert through Alertmanager when
# backups or storage need attention.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  namespaceSelector:
    matchNames:
      - longhorn-system
  endpoints:
    - port: manager
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: longhorn
      rules:
        # Catches every way a nightly run can fail, including the job never starting.
        # Volumes that have never been backed up report 0 and are left out.
        - alert: LonghornBackupOverdue
          expr: (time() - max by (volume) (longhorn_volume_last_backup_at)) > 108000 and max by (volume) (longhorn_volume_last_backup_at) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Volume {{ $labels.volume }} has had no backup for over 30 hours.
        # Without this, losing Longhorn's metrics would silence every rule here.
        - alert: LonghornMetricsMissing
          expr: absent(longhorn_volume_last_backup_at)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Prometheus has no Longhorn data, so backup and storage alerts can't fire.
        # States: 0 new, 1 pending, 2 in progress, 3 completed, 4 error, 5 unknown.
        - alert: LonghornBackupFailed
          expr: max by (backup, volume) (longhorn_backup_state) == 4
          labels:
            severity: warning
          annotations:
            summary: Backup {{ $labels.backup }} of volume {{ $labels.volume }} failed.
        # Robustness: 0 unknown, 1 healthy, 2 degraded, 3 faulted.
        - alert: LonghornVolumeNotHealthy
          expr: max by (volume) (longhorn_volume_robustness) >= 2
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Volume {{ $labels.volume }} is degraded or faulted.
        - alert: LonghornDiskNearlyFull
          expr: max by (node, disk) (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: A Longhorn disk on {{ $labels.node }} is over 85% full.
