# Longhorn has no login of its own, and anyone who reaches it can delete volumes and backups.
# Traefik asks Authentik about every request, and only admins are allowed through. The
# Cloudflare route must point at Traefik, never at longhorn-frontend, which would skip this.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: longhorn-system
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: longhorn.energiapower.llc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
---
# The login redirect comes back to this path on the same address. It lives in the authentik
# namespace because an Ingress can only reach services in its own namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-login
  namespace: authentik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: longhorn.energiapower.llc
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
