# Backups go to the router's shared folder. Longhorn creates its own backupstore
# folder inside. The router only speaks SMB 2.0.2, so the version is pinned.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: cifs://192.168.1.1/k8s-storage-folder?cifsOptions=vers=2.0,soft
  credentialSecret: cifs-secret
  pollInterval: 300s
