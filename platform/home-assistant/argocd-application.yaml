# Applied once by hand: kubectl apply -f platform/home-assistant/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/daav817/home-lab-hub.git
    targetRevision: main
    path: platform/home-assistant/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
