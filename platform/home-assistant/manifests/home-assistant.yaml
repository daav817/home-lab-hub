# Home Assistant: one place to control smart devices, cameras and phone alerts. It keeps its
# own login with 2FA, because a login page in front of it would break the phone app. It uses
# the node's network directly so it can discover devices on the home network.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
# The Parking Lot chime (generated tones, 1.2 s), copied to /config/www/sounds/.
binaryData:
  parking-alert.wav: 
data:
  # Copied into /config on every start, so change it here, not in the container.
  configuration.yaml: |
    default_config:

    homeassistant:
      external_url: https://home.energiapower.llc
      internal_url: http://192.168.1.102:8123
      # Settings kept in this repo, one file per topic, under packages/.
      packages: !include_dir_named packages

    # Home Assistant no longer reads "http:" from this file. It's set under Settings, System,
    # Network, which tries a change and asks you to keep it. The settings in use:
    #   Use X-Forwarded-For: on
    #   Trusted proxies: 10.42.0.0/16, 192.168.1.100, 192.168.1.101, 192.168.1.102
    #   IP ban: on, after 5 failed logins
    # The Cloudflare tunnel reaches Home Assistant from a pod address on the same node, or
    # from another node's address. Trusting only those lets a ban hit the real visitor.

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

  # Copied to /config/www/ (served as /local/camera-loading.svg): the spinner the Cameras
  # dashboard shows over a Blink camera while it wakes up.
  camera-loading.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
      <circle cx="60" cy="60" r="56" fill="#000" fill-opacity="0.55"/>
      <circle cx="60" cy="60" r="34" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="9"/>
      <circle cx="60" cy="60" r="34" fill="none" stroke="#03a9f4" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="60 154">
        <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60"
                          dur="1s" repeatCount="indefinite"/>
      </circle>
    </svg>

  # Copied to /config/packages/ on every start.
  camera_recording.yaml: |
    # Camera clips are saved while the Away switch (switch.camera_clips_away_recording, from the
    # clip keeper) is on OR the schedule helper schedule.camera_recording is on. Create that
    # helper once in Settings > Devices & services > Helpers > Schedule, named exactly
    # "Camera recording". This automation tells the clip keeper whenever the schedule changes;
    # until the helper exists it reports "off".
    automation:
      - id: camera_recording_schedule_to_clip_keeper
        alias: Camera recording schedule, tell the clip keeper
        mode: queued
        triggers:
          - trigger: state
            entity_id: schedule.camera_recording
          - trigger: homeassistant
            event: start
          - trigger: time_pattern
            minutes: "/5"
          - trigger: mqtt
            topic: clips/status
            payload: online
        actions:
          - action: mqtt.publish
            data:
              topic: clips/schedule
              payload: "{{ 'on' if is_state('schedule.camera_recording', 'on') else 'off' }}"
              retain: true

  parking_lot_alert.yaml: |
    # Plays a chime in every browser registered with Browser Mod (and shows a short note) when
    # Frigate sees a person or a car in the Parking Lot. Switch it on or off with
    # input_boolean.parking_lot_alert_sound (on the Cameras dashboard). At most one chime a minute.
    input_boolean:
      parking_lot_alert_sound:
        name: Parking Lot alert sound
        icon: mdi:bell-ring
      # The camera's own sound in the large view (tap the Parking Lot picture or Full screen).
      # Off: the large view is a silent picture. On: Home Assistant's player, with sound and
      # its controls. The small tile on the dashboard is always silent.
      parking_lot_live_sound:
        name: Parking Lot camera sound
        icon: mdi:volume-high

    automation:
      - id: parking_lot_detection_chime
        alias: Parking Lot person or car, chime in the browser
        mode: single
        triggers:
          - trigger: state
            entity_id:
              - binary_sensor.parking_lot_live_person_occupancy
              - binary_sensor.parking_lot_live_car_occupancy
            from: "off"
            to: "on"
        conditions:
          - condition: state
            entity_id: input_boolean.parking_lot_alert_sound
            state: "on"
        actions:
          # No browser named: Browser Mod sends it to every registered browser.
          - action: browser_mod.javascript
            data:
              code: "new Audio('/local/sounds/parking-alert.wav').play().catch(() => {});"
          - action: browser_mod.notification
            data:
              message: >-
                {{ 'Person' if trigger.entity_id.endswith('person_occupancy') else 'Car' }}
                in the Parking Lot
              duration: 8000
          - delay: "00:01:00"

  doorbell.yaml: |
    # Blink doesn't tell Home Assistant when the doorbell is pressed (no subscription), but it
    # does send a phone notification. The Home Assistant phone app's "Last notification" sensor,
    # limited to the Blink app, passes that notification here. Then:
    # - every Blink notification goes in the logbook (as "Blink notification"),
    # - a doorbell press fires event.front_door_doorbell (its history is the doorbell log),
    #   wakes the Front Door camera so Frigate records it, and tells the clip keeper, which
    #   saves the clip to the router (group "Doorbell") and lists the press on the hub's
    #   Recordings page,
    # - a motion notification from a battery camera wakes that camera too, so Frigate records.
    # Phone setup: Settings > Companion app > Manage sensors > Last notification: enable, give
    # the app notification access, and set its allow list to com.immedia.blink only (otherwise
    # every app's notifications reach Home Assistant).
    mqtt:
      event:
        - name: Front Door doorbell
          unique_id: front_door_doorbell
          state_topic: doorbell/front_door
          event_types:
            - press
          device_class: doorbell
          icon: mdi:doorbell

    automation:
      - id: blink_phone_notification
        alias: Blink phone notification, log it and handle the doorbell
        mode: queued
        max: 20
        triggers:
          # The phone's sensor is named after the phone, so match it by its ending.
          - trigger: event
            event_type: state_changed
        conditions:
          - condition: template
            value_template: >-
              {% set e = trigger.event.data %}
              {{ e.entity_id.endswith('_last_notification') and e.new_state is not none
                 and e.new_state.attributes.get('package') == 'com.immedia.blink'
                 and (e.old_state is none or e.new_state.last_changed != e.old_state.last_changed
                      or e.new_state.attributes.get('post_time') != e.old_state.attributes.get('post_time')) }}
        variables:
          title: "{{ trigger.event.data.new_state.attributes.get('android.title') or '' }}"
          text: "{{ trigger.event.data.new_state.attributes.get('android.text') or trigger.event.data.new_state.state }}"
          message: "{{ [title, text] | select | join(': ') }}"
          words: "{{ (title ~ ' ' ~ text) | lower }}"
          # Blink's wording, matched loosely; check the logbook if a press is missed.
          doorbell: "{{ words is search('doorbell|someone is at|rang|ringing|pressed') and 'motion' not in words }}"
          motion_camera: >-
            {% if 'motion' in words and 'front door' in words %}front_door
            {% elif 'motion' in words and 'porch' in words %}front_porch{% endif %}
        actions:
          - action: logbook.log
            data:
              name: Blink notification
              message: "{{ message }}"
          - if: "{{ doorbell }}"
            then:
              - action: mqtt.publish
                data:
                  topic: blink/front_door/start
                  payload: doorbell
              - action: mqtt.publish
                data:
                  topic: doorbell/front_door
                  payload: "{{ {'event_type': 'press', 'message': message} | to_json }}"
            else:
              - if: "{{ motion_camera | trim != '' }}"
                then:
                  - action: mqtt.publish
                    data:
                      topic: "blink/{{ motion_camera | trim }}/start"
                      payload: motion

  blink_live.yaml: |
    # When a battery Blink camera's live session ends, the Blink bridge waits 60 seconds for
    # "Continue" (blink/<camera>/state = waiting). This shows that prompt as a notification
    # and clears it once the camera is live again or the view has ended.
    automation:
      - id: blink_live_waiting
        alias: Blink live view paused, ask to continue
        mode: parallel
        triggers:
          - trigger: mqtt
            topic: blink/+/state
            payload: waiting
        actions:
          - action: persistent_notification.create
            data:
              notification_id: "blink_live_{{ trigger.topic.split('/')[1] }}"
              title: Blink live view paused
              message: >-
                {{ trigger.topic.split('/')[1] | replace('_', ' ') | title }}: Blink ended the
                live session. Press Continue on the Cameras dashboard within 60 seconds to keep
                watching.
      # When Blink sees motion on a battery camera, wake it so Frigate records and detects.
      # The camera takes about 5 seconds to wake, and Blink's motion sensors are only checked
      # every so often, so the start of each event is missed.
      - id: blink_motion_record
        alias: Blink motion, record in Frigate
        mode: parallel
        triggers:
          - trigger: state
            entity_id: binary_sensor.front_door_motion
            to: "on"
            id: front_door
          - trigger: state
            entity_id: binary_sensor.front_porch_and_swings_motion
            to: "on"
            id: front_porch
        actions:
          - action: mqtt.publish
            data:
              topic: "blink/{{ trigger.id }}/start"
              payload: motion
      - id: blink_live_clear
        alias: Blink live view, clear the prompt
        mode: parallel
        triggers:
          - trigger: mqtt
            topic: blink/+/state
        conditions:
          - condition: template
            value_template: "{{ trigger.payload != 'waiting' }}"
        actions:
          - action: persistent_notification.dismiss
            data:
              notification_id: "blink_live_{{ trigger.topic.split('/')[1] }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/critical-data: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  # Only one copy may use the settings volume at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:  # nosemgrep: run-as-non-root -- the Home Assistant image runs as root (s6 init); reviewed.
      # A fixed node gives Home Assistant a fixed address on the home network.
      nodeSelector:
        kubernetes.io/hostname: worker-02
      hostNetwork: true  # nosemgrep: hostnetwork-pod -- LAN device discovery (mDNS/SSDP) and a fixed address need the host network; reviewed.
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      initContainers:
        - name: config
          image: ghcr.io/home-assistant/home-assistant:2026.10.4
          command:
            - sh
            - -ceu
            - |
              cp /seed/configuration.yaml /config/configuration.yaml
              mkdir -p /config/packages
              cp /seed/blink_live.yaml /config/packages/blink_live.yaml
              cp /seed/doorbell.yaml /config/packages/doorbell.yaml
              mkdir -p /config/www
              cp /seed/camera-loading.svg /config/www/camera-loading.svg
              cp /seed/parking_lot_alert.yaml /config/packages/parking_lot_alert.yaml
              cp /seed/camera_recording.yaml /config/packages/camera_recording.yaml
              mkdir -p /config/www/sounds
              cp /seed/parking-alert.wav /config/www/sounds/parking-alert.wav
              [ -f /config/automations.yaml ] || echo '[]' > /config/automations.yaml
              [ -f /config/scenes.yaml ] || echo '[]' > /config/scenes.yaml
              [ -f /config/scripts.yaml ] || echo '{}' > /config/scripts.yaml

              # Frigate's Home Assistant integration, normally installed through HACS. This
              # installs one pinned release, checked against its known checksum, and only when
              # the installed version differs. To update, change both values below.
              version=5.15.6
              sha256=a759a2fa7c773e90f8560f1d212c9a30ca26e786309a03350ae5b468b2ecd7aa
              target=/config/custom_components/frigate
              if [ "$(cat "$target/.installed-version" 2>/dev/null)" != "$version" ]; then
                cd /tmp
                curl -fsSL -o frigate.tgz "https://github.com/blakeblackshear/frigate-hass-integration/archive/refs/tags/v$version.tar.gz"
                echo "$sha256  frigate.tgz" | sha256sum -c -
                tar xzf frigate.tgz
                rm -rf "$target" && mkdir -p /config/custom_components
                mv "frigate-hass-integration-$version/custom_components/frigate" "$target"
                echo "$version" > "$target/.installed-version"
                echo "Installed the Frigate integration $version"
              fi

              # Browser Mod: lets Home Assistant play a sound in a browser that has the
              # dashboard open (the Parking Lot chime). Same pinned, checksummed install.
              version=3.4.0
              sha256=14bd86d006afc0bfe4a2d3b74e94a83c4e47f5906c3c83442423bd3f21e520c9
              target=/config/custom_components/browser_mod
              if [ "$(cat "$target/.installed-version" 2>/dev/null)" != "$version" ]; then
                cd /tmp
                curl -fsSL -o browser_mod.tgz "https://github.com/thomasloven/hass-browser_mod/archive/refs/tags/v$version.tar.gz"
                echo "$sha256  browser_mod.tgz" | sha256sum -c -
                tar xzf browser_mod.tgz
                rm -rf "$target" && mkdir -p /config/custom_components
                mv "hass-browser_mod-$version/custom_components/browser_mod" "$target"
                echo "$version" > "$target/.installed-version"
                echo "Installed Browser Mod $version"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: home-assistant  # nosemgrep: allow-privilege-escalation-no-securitycontext -- Home Assistant container, same root image; reviewed.
          image: ghcr.io/home-assistant/home-assistant:2026.10.4
          env:
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8123
          startupProbe:
            tcpSocket:
              port: 8123
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8123
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: seed
          configMap:
            name: home-assistant-config
---
# Used by the Cloudflare tunnel and the hub's status light.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
