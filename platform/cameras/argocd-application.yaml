# Applied once by hand: kubectl apply -f platform/cameras/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cameras
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/daav817/home-lab-hub.git
    targetRevision: main
    path: platform/cameras/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cameras
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
