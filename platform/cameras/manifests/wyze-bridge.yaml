# Wyze bridge: turns Wyze cameras into local streams for Frigate. It signs in to Wyze's cloud to
# find the cameras, then pulls video straight from them over the IOT network, so it runs on
# worker-02. The Wyze login is the sealed secret wyze-bridge, made by scripts/seal-wyze.ps1.
# Streams need the same login as the Neolink ones (secret camera-streams).
#
# It uses worker-02's own network: Wyze cameras send video back to the bridge over UDP, which
# the cluster's address translation breaks ("discovery timeout"). worker-02's firewall
# (scripts/worker-02-firewall.sh) lets UDP in from the two Wyze cameras only, and blocks the
# bridge's ports from the main network, since its web page and go2rtc page have no login.
# Frigate reaches the streams from inside worker-02.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyze-bridge
  namespace: cameras
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyze-bridge
  namespace: cameras
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyze-bridge
  template:
    metadata:
      labels:
        app: wyze-bridge
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-02
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      containers:
        - name: wyze-bridge
          # Release 4.5.0 (2026-07-02) from the maintained IDisposable fork. Both it and
          # 4.6.1-beta.1 get "discovery timeout" from the Pan v1 cameras.
          image: idisposablegithub365/wyze-bridge@sha256:708903d2882c76966ecb29763a075372d89773aa6796d0aab70f04369cc6d521
          envFrom:
            - secretRef:
                name: wyze-bridge
          env:
            - name: FRIGATE_RTSP_USER
              valueFrom:
                secretKeyRef:
                  name: camera-streams
                  key: FRIGATE_RTSP_USER
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camera-streams
                  key: FRIGATE_RTSP_PASSWORD
            - name: STREAM_AUTH
              value: "$(FRIGATE_RTSP_USER):$(FRIGATE_RTSP_PASSWORD)"
            - name: STATE_DIR
              value: /config
            - name: TZ
              value: America/New_York
          ports:
            - name: rtsp
              containerPort: 8554
            - name: web
              containerPort: 5080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wyze-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: wyze-bridge
  namespace: cameras
spec:
  selector:
    app: wyze-bridge
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
