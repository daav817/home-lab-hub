# Wyze bridge: turns Wyze cameras into local streams for Frigate. It signs in to Wyze's cloud to
# find the cameras, then pulls video straight from them over the IOT network, so it runs on
# worker-02. The Wyze login is the sealed secret wyze-bridge, made by scripts/seal-wyze.ps1.
# Streams need the same login as the Neolink ones (secret camera-streams).
#
# It uses worker-02's own network: Wyze cameras send video back to the bridge over UDP, which
# the cluster's address translation breaks ("discovery timeout"). worker-02's firewall
# (scripts/worker-02-firewall.sh) lets UDP in from the two Wyze cameras only, and blocks the
# bridge's ports from the main network, since its web page and go2rtc page have no login.
# Frigate reaches the streams from inside worker-02.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyze-bridge
  namespace: cameras
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyze-bridge
  namespace: cameras
spec:
  # Paused 2026-11-07. Both Pan v1 cameras answer the bridge's search on the IOT network and
  # the replies reach its sockets, but both this bridge (Wyze's own TUTK library) and the
  # IDisposable fork time out after that. The cause looks to be on the camera or Wyze side.
  # Set to 1 to try again; the login, storage and firewall rules are still in place.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyze-bridge
  template:
    metadata:
      labels:
        app: wyze-bridge
    spec:  # nosemgrep: run-as-non-root -- vendor image runs as root; scaled to 0 (paused); reviewed.
      nodeSelector:
        kubernetes.io/hostname: worker-02
      hostNetwork: true  # nosemgrep: hostnetwork-pod -- Wyze TUTK discovery needs the node's IOT Wi-Fi leg; worker-02 nftables guard; reviewed.
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      containers:
        - name: wyze-bridge
          # The original bridge (mrlt8, release 2.10.3, 2024-09-13). It uses Wyze's own TUTK
          # library, which the Pan v1 needs: the maintained IDisposable fork (4.5.0 and
          # 4.6.1-beta.1) got "discovery timeout" from these cameras. Not updated since 2024.
          image: mrlt8/wyze-bridge@sha256:af2d638a6d6d52e15ddcfb711e5b905e484b1f519986ad33b9be562b6277b987
          env:
            - name: WYZE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: wyze-bridge
                  key: WYZE_EMAIL
            - name: WYZE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wyze-bridge
                  key: WYZE_PASSWORD
            - name: API_ID
              valueFrom:
                secretKeyRef:
                  name: wyze-bridge
                  key: WYZE_API_ID
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: wyze-bridge
                  key: WYZE_API_KEY
            - name: FRIGATE_RTSP_USER
              valueFrom:
                secretKeyRef:
                  name: camera-streams
                  key: FRIGATE_RTSP_USER
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camera-streams
                  key: FRIGATE_RTSP_PASSWORD
            # Streams need the same login as the Neolink ones.
            - name: STREAM_AUTH
              value: "$(FRIGATE_RTSP_USER):$(FRIGATE_RTSP_PASSWORD)"
            - name: TZ
              value: America/New_York
            # Stay connected, rather than only when something asks for video. Frigate reads
            # the cameras all the time anyway.
            - name: ON_DEMAND
              value: "False"
          # Web page login and API token. The bridge prints these when it starts, so its log
          # must never be read without filtering out lines containing [AUTH] or "Auth [".
          envFrom:
            - secretRef:
                name: wyze-bridge-web
          ports:
            - name: rtsp
              containerPort: 8554
            - name: web
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /tokens
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wyze-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: wyze-bridge
  namespace: cameras
spec:
  selector:
    app: wyze-bridge
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
