# go2rtc next to the Blink bridge. Each stream reads the bridge's local MPEG-TS port, which
# starts a Blink live session only while someone is watching. The RTSP port has no login, so a
# network rule limits it to Frigate (this namespace) and Home Assistant.
log:
  level: warn
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: ":8554"
webrtc:
  listen: ""
# Blink's audio arrives without a complete description (sample rate 0/0), which players that
# convert audio fail on ("Invalid data found"). ffmpeg re-encodes the audio and copies the video.
streams:
  front_door: ffmpeg:tcp://127.0.0.1:18001#video=copy#audio=aac
  front_porch: ffmpeg:tcp://127.0.0.1:18002#video=copy#audio=aac
  parking_lot: ffmpeg:tcp://127.0.0.1:18003#video=copy#audio=aac
