# Neolink turns the Reolink E1 cameras, which have no local video stream of their own, into
# streams that Frigate and Home Assistant can use. It runs on worker-02, the only node that can
# reach the IOT network, and talks to the cameras directly, never through Reolink's servers.
# Its config, with the camera logins, is the sealed secret neolink-config, made by
# scripts/seal-neolink.ps1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neolink
  namespace: cameras
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neolink
  template:
    metadata:
      labels:
        app: neolink
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-02
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # Copies the sealed camera config into memory and adds, without reading the passwords:
      # - stream = "mainStream". Nothing reads the sub stream, and pulling it anyway made
      #   Neolink's memory grow until it was killed.
      # - Home Assistant controls for each camera: pan/tilt buttons, IR light, status LED,
      #   motion and reboot. They appear in Home Assistant through MQTT.
      # - The MQTT login, from the sealed secret mqtt-clients.
      initContainers:
        - name: prepare-config
          image: busybox:1.36.1
          command:
            - sh
            - -ceu
            - |
              awk '
                {print}
                /^discovery = "local"$/ {print "stream = \"mainStream\""}
                /^permitted_users = / {
                  print "[cameras.mqtt]"
                  print "enable_preview = false"
                  print "[cameras.mqtt.discovery]"
                  print "topic = \"homeassistant\""
                  print "features = [\"pt\", \"ir\", \"led\", \"motion\", \"reboot\"]"
                }
              ' /secret/neolink.toml > /etc/neolink/neolink.toml
              printf '\n[mqtt]\nbroker_addr = "mosquitto.home-assistant.svc.cluster.local"\nport = 1883\ncredentials = ["%s", "%s"]\n' \
                "$NEOLINK_MQTT_USER" "$NEOLINK_MQTT_PASSWORD" >> /etc/neolink/neolink.toml
              echo "cameras with main stream only: $(grep -c '^stream = "mainStream"$' /etc/neolink/neolink.toml)"
              echo "cameras with Home Assistant controls: $(grep -c '^\[cameras.mqtt.discovery\]$' /etc/neolink/neolink.toml)"
              # Neolink announces its controls to Home Assistant once, at start. If Mosquitto
              # isn't up yet they're lost, so wait for it (up to 2 minutes).
              for i in $(seq 1 60); do
                nc -z -w 2 mosquitto.home-assistant.svc.cluster.local 1883 && { echo "Mosquitto is up"; exit 0; }
                sleep 2
              done
              echo "Mosquitto isn't answering; starting anyway"
          env:
            - name: NEOLINK_MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mqtt-clients
                  key: NEOLINK_MQTT_USER
            - name: NEOLINK_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-clients
                  key: NEOLINK_MQTT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sealed-config
              mountPath: /secret
              readOnly: true
            - name: config
              mountPath: /etc/neolink
      containers:
        - name: neolink
          # Release v0.6.2. The 2025-01-30 build stalled when limited to the main stream.
          image: quantumentangledandy/neolink@sha256:5d67d8b59631281ca8dd079ab3e0ada3d85f491d64a9e2f71533c89883574697
          command: ["/usr/local/bin/neolink"]
          args: ["mqtt-rtsp", "--config=/etc/neolink/neolink.toml"]
          # Neolink saves small settings and a font cache under the home folder.
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
          ports:
            - name: rtsp
              containerPort: 8554
          startupProbe:
            tcpSocket:
              port: 8554
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8554
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/neolink
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sealed-config
          secret:
            secretName: neolink-config
            defaultMode: 0440
        # The config with the stream setting added. In memory only, so the logins never
        # reach a disk.
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neolink
  namespace: cameras
spec:
  selector:
    app: neolink
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
---
# Only the camera apps may open the streams: anything in this namespace (Frigate, later) and
# Home Assistant, which uses worker-02's own address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neolink
  namespace: cameras
spec:
  podSelector:
    matchLabels:
      app: neolink
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - ipBlock:
            cidr: 192.168.1.102/32
      ports:
        - port: 8554
          protocol: TCP
