<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Home Lab Hub</title>
  <!-- A lab flask in the hub's colors. The three linked dots in the liquid are the cluster's three nodes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b34"/>
      <stop offset="1" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
  <!-- liquid -->
  <path d="M18.6 38.5 q6.6 -3.2 13.4 0 t13.4 0 L50.6 47.4 a3.6 3.6 0 0 1 -3.1 5.6 h-31 a3.6 3.6 0 0 1 -3.1 -5.6 Z" fill="url(#liquid)"/>
  <!-- cluster: three nodes -->
  <g stroke="#060914" stroke-width="1.8" stroke-linecap="round" fill="#060914">
    <path d="M24.5 48 L32 42.5 L39.5 48 Z" fill="none"/>
    <circle cx="24.5" cy="48" r="2.6"/>
    <circle cx="32" cy="42.5" r="2.6"/>
    <circle cx="39.5" cy="48" r="2.6"/>
  </g>
  <!-- bubbles -->
  <circle cx="30" cy="31" r="1.8" fill="#22d3ee"/>
  <circle cx="34.5" cy="25" r="1.3" fill="#a78bfa"/>
  <!-- flask -->
  <path d="M27 11 V25.5 L11.8 48.2 a4.4 4.4 0 0 0 3.7 6.8 h33 a4.4 4.4 0 0 0 3.7 -6.8 L37 25.5 V11" fill="none" stroke="#eef1fb" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M23.5 10.5 H40.5" stroke="#eef1fb" stroke-width="3.4" stroke-linecap="round"/>
</svg>
